name: share2cal
options:
  bundleIdPrefix: com.dustinmichels.share2cal
  deploymentTarget:
    iOS: 14.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Share2Cal
      PRODUCT_BUNDLE_IDENTIFIER: com.dustinmichels.share2cal
      DEVELOPMENT_TEAM: HFXMJ5M53V
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      ENABLE_USER_SCRIPT_SANDBOXING: false
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  share2cal_iOS:
    type: application
    platform: iOS
    productName: Share2Cal
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
        buildPhase: none
      - path: share2cal_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: share2cal_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        CFBundleDisplayName: "Share2Cal"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.dustinmichels.share2cal
            CFBundleURLSchemes:
              - share2cal
        NSCalendarsUsageDescription: "Share2Cal uses your calendar to save events created from scanned images."
        NSCalendarsFullAccessUsageDescription: "Share2Cal needs full calendar access to list your calendars and save events to the selected calendar."
        NSCalendarsWriteOnlyAccessUsageDescription: "Share2Cal needs access to save events directly to your calendar."
        NSCameraUsageDescription: "Share2Cal uses your camera to capture photos of event flyers, invitations, and schedules."
        NSPhotoLibraryUsageDescription: "Share2Cal needs access to your photo library to select flyer images and screenshots."
        NSPhotoLibraryAddUsageDescription: "Share2Cal needs permission to save images to your photo library."
        NSMicrophoneUsageDescription: "Share2Cal uses the camera to capture images of event flyers."
        NSLocalNetworkUsageDescription: "Share2Cal needs local network access to connect to the development server."
    entitlements:
      path: share2cal_iOS/share2cal_iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dustinmichels.share2cal
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ENABLE_USER_SCRIPT_SANDBOXING: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - target: ShareExtension
      - framework: libapp.a
        embed: false
      - sdk: Accelerate.framework
      - sdk: CoreGraphics.framework
      - sdk: EventKit.framework
      - sdk: ImageIO.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: Vision.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: "$SRCROOT/build_rust.sh"
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        CFBundleDisplayName: "Share2Cal"
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dustinmichels.share2cal
    settings:
      base:
        PRODUCT_NAME: ShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.dustinmichels.share2cal.ShareExtension
        DEVELOPMENT_TEAM: HFXMJ5M53V
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        INFOPLIST_FILE: ShareExtension/Info.plist
        ENABLE_BITCODE: false
        ENABLE_USER_SCRIPT_SANDBOXING: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64
    dependencies:
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: MobileCoreServices.framework
